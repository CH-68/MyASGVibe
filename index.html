<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Avant-Garde Web App (Static)</title>
    <meta name="description" content="Interactive Avant-Garde Web App - static, node-free build." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="default_shadcn_theme.css">
    <link rel="stylesheet" href="src/styles/fonts.css">
    <link rel="stylesheet" href="src/styles/static.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      :root{ --bg:#071829; --panel:#0b2340; --accent:#00F0FF; --muted:#9aa; --glass:rgba(255,255,255,0.03);} 
      html, body { height:100%; margin:0; padding-left:1in; padding-right:1in; background:var(--bg); color:#dfe; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
      #root { min-height:100%; background:transparent; max-width:calc(100% - 2in); margin:0 auto; }
      header h1{ font-family:Rajdhani, sans-serif; letter-spacing:0.06em; color: #bfefff; }
      .btn{ display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:12px; background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--accent); cursor:pointer; }
      .btn.primary{ background:linear-gradient(135deg,#0066FF,#00F0FF); color:#04243a; font-weight:700; box-shadow:0 6px 18px rgba(0,96,170,0.18); }
      .glass.card{ background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); padding:12px; border-radius:12px; }
      .tab{ padding:8px 14px; border-radius:8px; background:transparent; border:none; color:#9aa; }
      .tab.active{ background:linear-gradient(135deg,#003b6b,#0066FF); color:#dff; box-shadow:0 6px 12px rgba(0,96,170,0.08); }
      /* dock prominence */
      #dock .btn{ font-weight:600; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script src="app.js"></script>
  </body>
</html>
